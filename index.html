<body>
    <form action="#" method="post" enctype="multipart/form-data">
        <div>
            <p>Имя</p>
            <input placeholder="Имя" tabindex="1" type="text" name="username" id="">
        </div>
        <div>
            <p>Пароль</p>
            <input tabindex="2" type="password" name="userpass" id="">
        </div>
        <div>
            <p>Телефон</p>
            <input tabindex="3" type="tel" name="userphone" id="">
        </div>
        <div>
            <p>Пол</p>
            <div>
                <input tabindex="4" checked type="radio" name="gender" value="male" id=""> Мужской
            </div>
            <div>
                <input tabindex="4" type="radio" name="gender" value="female" id=""> Женский
            </div>
        </div>
        <div>
            <p>Имущество</p>
            <div>
                <input tabindex="5" checked type="checkbox" name="bike" id="yes">Велик
            </div>
            <div>
                <input tabindex="6" type="checkbox" name="car" id="yes">Машина
            </div>
            <div>
                <input tabindex="7" disabled type="checkbox" name="house" id="yes">Дом
            </div>
        </div>
        <div>
            <p>Дополнительная информация</p>
            <textarea tabindex="8" name="text" id=""></textarea>
        </div>
        <div>
            <p>Прикрепить фото</p>
            <input tabindex="9" type="file" name="userfoto" id="">
        </div>
        <div>
            <p>Любимый цвет</p>
            <select tabindex="10" name="color" id="">
                <option value="red">Красный</option>
                <option value="green">Зеленый</option>
                <option selected value="yellow">Желтый</option>
            </select>
        </div>
        <div>
            <p>Действия</p>
            <button tabindex="11" type="submit">Отправить</button>
            <button tabindex="12" type="reset">Очистить</button>
        </div>
    </form>
