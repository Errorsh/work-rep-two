<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Важные мета атрибуты
    первые атирбуты мета тега - отвечают за то, для чего будет использоваться данный мета-тег, а атрибут content - значение данного свойства.
    
    4 категории:
    1. Отображение контента.
    2. Теги для SEO. (search engine optimization - комплекс действий, которые помогают потенциальным клиентам быстро найти ваш сайт в поисковых системах)
    3. Технические метатеги.
    4. Теги для соцсетей. -->

    <!-- Кодировка страницы -->
    <meta charset="UTF-8">
    <!-- Настройки адаптивности страницы -->
    <!-- Фиксировання ширина -->
    <!-- <meta name="viewport" content="width=1170" -->

    <!-- Адаптивность  -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <!-- Отключает формирование ссылки  номера телефона на iOS -->
    <meta name="format-detectiob" content="telephone=no">
    <meta http-equiv="" content=""> <!-- устаревшая форма meta charset -->

    <!-- Краткое описание страницы -->
    <meta name="description" content="Что такое метатеги и дял чего они нужны">
    <!-- Ключевые слова -->
    <meta name="keywords" content="мета теги, meta , мета теги для seo">

    <!-- Управление доступом поисковых роботов к странице -->
    <!-- <meta name="robots" content=""> -->

    
    <!-- Запрет индексации ссылок и изображений на странице -->
    <!-- <meta name="robots" content="noimageindex, nofollow"> -->
    
    <!-- Запрет индексации страницы полностью
    <meta name="robots" content="noindex, nofollow">
     или -->
    <meta name="robots" content="none"> 

    <!-- Автор странциы -->
    <meta name="Author" content="Дарт Вейдер">
    <!-- Авторские права -->
    <meta name="Copyright" content="Люк Скайуокер">
    <!-- Адрес автора -->
    <meta name="Address" content="Татуин, кратер №97"> 

    <!-- Редирект (перезагрузка) страницы. -->
    <!-- Задержка в секундах; url=адрес сайта/страницы -->
    <meta http-equiv="refresh" content="5; url=index.html">


    <meta property="" content="">


    <link rel="stylesheet" href="./css/style.css">
    <title>практика по FLEXBOX</title>
</head>
<body>
   <div class="transition">
    <div class="button button_1">
        наведи на меня
    </div>
   </div>
</body>
</html>
